[profile.default]
src = "src"
test = "test"
libs = ["lib"]
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "out" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false
